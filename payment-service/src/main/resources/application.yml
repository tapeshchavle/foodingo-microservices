spring:
  application:
    name: payment-service
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/foodingo_payment}
      auto-index-creation: true
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

razorpay:
  key: ${RAZORPAY_KEY:rzp_test_fIHdXKFZG9UZ0w}
  secret: ${RAZORPAY_SECRET:OFLTu1nDmfyyOjSjlOH3b4u2}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.foodingo.payment: DEBUG

